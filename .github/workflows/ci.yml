name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python -m compileall -q app.py asr_service.py audio_validation.py request_security.py gpu_lock.py tests
      - run: python -m unittest discover -s tests -v
