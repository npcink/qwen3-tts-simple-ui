[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-simple-ui"
version = "0.1.0a1"
description = "A constrained local UI for compatible Qwen3-TTS services."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "filelock>=3.13.0,<4.0.0",
  "gradio-client>=1.3.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]

[tool.setuptools]
py-modules = ["app", "asr_service", "gpu_lock"]
